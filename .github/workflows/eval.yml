name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      # Ollama and the NLI model are stubbed here; the job below uses the real ones.
      - name: Run tests
        run: uv run pytest -v

  model-eval:
    name: End-to-end eval (real Ollama + NLI model)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check the real NLI model behaves as documented
        run: uv run pytest -m requires_models -v

      - name: Install Ollama and pull gemma3:4b
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 2; done
          ollama pull gemma3:4b
          ollama --version

      # Every dataset in full, scored exactly as the API/dashboard would.
      # run_eval.py exits non-zero if any model call failed.
      - name: Evaluate gemma3:4b on every dataset
        run: |
          for d in legal_qa summarization code_gen; do
            uv run python scripts/run_eval.py \
              --dataset "datasets/$d" \
              --models gemma3:4b \
              --no-mlflow \
              --output "outputs/ci_$d.csv" \
              --summary-json "outputs/ci_$d.json"
          done

      - name: Write job summary
        if: always()
        run: |
          uv run python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          print("### gemma3:4b on GitHub's ubuntu-latest runner (CPU)\n")
          print("| dataset | status | samples | ROUGE-L | responses w/ contradiction | supported sentences | unit-test pass rate | latency p50 |")
          print("|---|---|---|---|---|---|---|---|")
          fmt = lambda v, pct=False: "—" if v is None else (f"{v:.0%}" if pct else f"{v:.3f}")
          for path in sorted(glob.glob("outputs/ci_*.json")):
              s = json.load(open(path))
              m = s["models"].get("gemma3:4b", {})
              lat = m.get("latency_p50")
              print(f"| {s['dataset']} | {s['status']} | {m.get('num_samples', 0)} | {fmt(m.get('rougeL_mean'))} | "
                    f"{fmt(m.get('halluc_rate'), True)} | {fmt(m.get('entailment_rate_mean'), True)} | "
                    f"{fmt(m.get('pass_rate'), True)} | {'—' if lat is None else f'{lat/1000:.1f}s'} |")
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: outputs/

  frontend-checks:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    name: Docker images build and start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (torch wheels are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build API image and check it serves
        run: |
          docker build -f api/Dockerfile -t llm-eval-api .
          docker run -d --name api -p 8000:8000 llm-eval-api
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/datasets | grep -q code_gen
          docker rm -f api

      - name: Build frontend image and check it serves
        run: |
          docker build -t llm-eval-frontend frontend
          docker run -d --name web -p 8080:80 llm-eval-frontend
          sleep 2
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf http://localhost:8080/health | grep -q '<div id="root">'  # SPA fallback

      - name: Build dashboard image
        run: docker build -t llm-eval-dashboard .

  deploy:
    needs: [model-eval, backend-tests, frontend-checks, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for AWS OIDC role assumption
      contents: read
    env:
      AWS_REGION: us-east-1
      ECR_API_REPO: llm-eval-harness/api
      ECR_FRONTEND_REPO: llm-eval-harness/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Skip if AWS deploy role isn't configured
        id: gate
        run: |
          if [ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "AWS_DEPLOY_ROLE_ARN secret not set — skipping deploy. See README#deployment-aws for setup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.gate.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.gate.outputs.configured == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        if: steps.gate.outputs.configured == 'true'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -f api/Dockerfile -t "$REGISTRY/$ECR_API_REPO:${{ github.sha }}" -t "$REGISTRY/$ECR_API_REPO:latest" .
          docker push "$REGISTRY/$ECR_API_REPO:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_API_REPO:latest"

      - name: Build and push frontend image
        if: steps.gate.outputs.configured == 'true'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL="${{ secrets.API_PUBLIC_URL }}" \
            -t "$REGISTRY/$ECR_FRONTEND_REPO:${{ github.sha }}" \
            -t "$REGISTRY/$ECR_FRONTEND_REPO:latest" \
            frontend
          docker push "$REGISTRY/$ECR_FRONTEND_REPO:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_FRONTEND_REPO:latest"

      - name: Redeploy App Runner services
        if: steps.gate.outputs.configured == 'true'
        run: |
          aws apprunner start-deployment --service-arn "${{ secrets.AWS_APPRUNNER_API_SERVICE_ARN }}"
          aws apprunner start-deployment --service-arn "${{ secrets.AWS_APPRUNNER_FRONTEND_SERVICE_ARN }}"
