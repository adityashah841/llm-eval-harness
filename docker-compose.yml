# Ollama must already be running on the host (`ollama serve`), with the
# models you want to evaluate pulled.
services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - MLFLOW_TRACKING_URI=sqlite:////app/mlruns/mlflow.db
    volumes:
      - ./datasets:/app/datasets
      - ./mlruns:/app/mlruns
      - hf-cache:/root/.cache/huggingface

  mlflow:
    image: python:3.11-slim
    command: >
      bash -c "pip install --no-cache-dir mlflow==3.11.1 && mlflow ui
      --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlruns/mlflow.db"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LLM_EVAL_DB_PATH=/app/data/metrics.db
      - MLFLOW_TRACKING_URI=sqlite:////app/mlruns/mlflow.db
      - LLM_EVAL_CORS_ORIGINS=http://localhost:5173
    volumes:
      - ./datasets:/app/datasets
      - ./data:/app/data
      - ./mlruns:/app/mlruns
      - hf-cache:/root/.cache/huggingface

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  hf-cache:
